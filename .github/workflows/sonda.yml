name: sonda
on: push
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://liturgia.cancaonova.com/pb/?sDia=16&sMes=11&sAno=2026" "https://liturgiadiaria.cnbb.org.br/app/user/user/UserView.php?ano=2026&mes=11&dia=16" "https://liturgiadiaria.cnbb.org.br/" "https://www.cnbb.org.br/liturgia-diaria/" "https://liturgia.cnbb.org.br/"; do
            echo "=== $u"; curl -sL -m 20 -o /tmp/p -w "%{http_code} %{url_effective}\n" -A "Mozilla/5.0" "$u"; grep -o '[0-9]\{1,2\}ª feira[^<]\{0,60\}\|Mt [0-9][^<]\{0,15\}\|Mc [0-9][^<]\{0,15\}\|Lc [0-9][^<]\{0,15\}\|Jo [0-9][^<]\{0,15\}' /tmp/p | head -5
          done
